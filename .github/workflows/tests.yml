name: test

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: |
          go mod download
          make fmt-check
          make vet
          bash scripts/check-docs-templates.sh

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          go mod download
          make test

  acceptance:
    if: |
      success() &&
      needs.verify.result == 'success' &&
      needs.unit-test.result == 'success'
    needs:
      - verify
      - unit-test
    runs-on: ubuntu-22.04 # Ceph packages are only available for Jammy
    strategy:
      matrix:
        ceph-release:
          - 'tentacle'
          - 'squid'
          - 'reef'
      fail-fast: false
    concurrency:
      group: ${{ github.head_ref || github.run_id }}-${{ matrix.ceph-release }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
          terraform_version: 1.16.7
      - run: |
          # Add Ceph repository
          curl -fsSL https://download.ceph.com/keys/release.asc | sudo gpg --dearmor -o /usr/share/keyrings/ceph-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/ceph-archive-keyring.gpg] https://download.ceph.com/debian-${{ matrix.ceph-release }}/ jammy main" | sudo tee /etc/apt/sources.list.d/ceph.list
          sudo apt-get update
          sudo apt-get install -y ceph ceph-mgr-dashboard radosgw
          # Workaround for https://tracker.ceph.com/issues/74199
          sudo rm -fr /usr/share/ceph/mgr/dashboard/controllers/smb.py
      - run: make ci-setup
      - name: Verify OIDC provider (STS/WebIdentity fixture)
        run: |
          DEBUG=1 ./scripts/jwt-token.sh > /tmp/id_token 2>/tmp/id_token.dbg || { cat /tmp/id_token.dbg; exit 1; }
          cat /tmp/id_token.dbg
          parts=$(awk -F. '{print NF}' /tmp/id_token)
          [ "$parts" = "3" ] || { echo "ERROR: expected a 3-part JWT, got $parts"; exit 1; }
          echo "OIDC id_token minted successfully"
      - run: make ci-test
        env:
          CEPH_VERSION: ${{ matrix.ceph-release }}
        timeout-minutes: 10
      - name: Dump logs on failure
        if: failure()
        run: |
          make ceph-logs
          echo "=== OIDC provider logs ==="
          docker compose -f scripts/compose.yml logs || true
      - run: make ci-cleanup
        if: always()
